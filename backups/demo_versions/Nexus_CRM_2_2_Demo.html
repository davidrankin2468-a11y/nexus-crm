<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus CRM Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#081321;color:#e9f4f4;font:15px Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}aside{background:#101e30;border-right:1px solid #2b4353;width:230px;padding:24px 12px}h2{margin:0 12px 20px}b,.accent{color:#adf47b}button{cursor:pointer;border:0}.nav{display:block;width:100%;padding:14px;text-align:left;color:#a6bbca;background:transparent;border-radius:10px;font-size:15px}.nav.active,.nav:hover{background:#234138;color:#bcfa8b}main{padding:32px;flex:1;min-width:0}.eyebrow{color:#adf47b;letter-spacing:2px;font-size:12px}h1{margin:8px 0 6px;font-size:32px}p,small{color:#96acbb}.banner{background:#1d342b;color:#c4f6a5;padding:12px 16px;border-radius:10px;margin:24px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:#1a2c40;color:#c3d3de;border:1px solid #31485a;border-radius:9px;padding:10px 13px}.tabs button.active{background:#aaf078;color:#102018}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{border:1px solid #2b4153;background:#122338;border-radius:14px;padding:20px}.card strong{display:block;font-size:26px;margin-top:14px;color:#b7fa8a}.panel{margin:12px 0}.panel h3{margin-top:0}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:13px 8px;border-bottom:1px solid #2a3e50}th{color:#9db1be;font-weight:500}.status{color:#b7fa8a}.muted{font-size:13px;color:#9bb1bf}@media(max-width:750px){.app{display:block}aside{width:100%;padding:12px}h2{margin:8px}.nav{display:inline-block;width:auto;font-size:12px;padding:10px}main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}}</style><div class="app"><aside><h2>NEXUS <b>CRM</b></h2><div id="nav"></div><p class="muted">Nexus Software Solutions<br>Interactive Preview</p></aside><main><div class="eyebrow">NEXUS BUSINESS SUITE</div><h1 id="heading">Dashboard</h1><p id="description">Your business at a glance</p><div class="banner">● DEMO MODE — fictional sample data only; no real accounts or customer records.</div><div class="tabs" id="tabs"></div><div id="view"></div></main></div><script>const data={Dashboard:['Overview','Recent Activity'],Customers:['Directory','Contacts','History'],Operations:['Jobs','Schedule','Employees'],Finance:['Estimates','Invoices','Payments','Reports'],Management:['Company Settings','Security','Backups','Cloud Sync','Licensing']};let section='Dashboard',sub='Overview';const el=id=>document.getElementById(id);const rows=(heads,items)=>'<table><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+items.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table>';function show(){el('nav').innerHTML=Object.keys(data).map(s=>'<button class="nav '+(s===section?'active':'')+'" data-section="'+s+'">'+s+'</button>').join('');el('heading').textContent=section;el('description').textContent={Dashboard:'Your business at a glance',Customers:'Customers, contacts, and history',Operations:'Jobs, scheduling, and team',Finance:'Estimates, invoices, and reports',Management:'Settings, security, and sync'}[section];el('tabs').innerHTML=data[section].map(s=>'<button class="'+(s===sub?'active':'')+'" data-sub="'+s+'">'+s+'</button>').join('');let v='';if(section==='Dashboard'){v='<div class="stats">'+[['Revenue','$42,680'],['Customers','128'],['Open jobs','18'],['Outstanding','$7,275']].map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel"><h3>Recent Jobs</h3>'+rows(['Job','Customer','Status'],[['Garden Renovation','Olivia Martinez','In progress'],['Interior Repaint','Cedar Grove Homes','Scheduled'],['Deck Repair','Harper Construction','Estimate']])+'</div>'}else if(section==='Customers'){v='<div class="panel"><h3>'+sub+'</h3>'+rows(['Customer','Industry','Status'],[['Olivia Martinez','Landscaping','Active'],['Harper Construction','Construction','Active'],['Cedar Grove Homes','Painting','Lead']])+'</div>'}else if(section==='Operations'){v='<div class="panel"><h3>'+sub+'</h3>'+rows(['Job / Team','Assignment','Status'],[['Garden Renovation','Olivia Martinez','In progress'],['Interior Repaint','Cedar Grove Homes','Scheduled'],['Deck Repair','Harper Construction','Pending']])+'</div>'}else if(section==='Finance'){v='<div class="panel"><h3>'+sub+'</h3>'+rows(['Document','Customer','Amount','Status'],[['INV-1042','Harper Construction','$3,850','Paid'],['INV-1043','Olivia Martinez','$1,275','Pending'],['INV-1044','Summit Property','$2,150','Pending']])+'</div>'}else{let descriptions={'Company Settings':'Manage company branding, preferences, and business information.','Security':'User roles and permissions. No real authentication is enabled in this demo.','Backups':'Backup and restore settings will appear in the installed CRM.','Cloud Sync':'Cloud synchronization is not connected in this design demo.','Licensing':'Commercial licensing configuration is planned.'};v='<div class="panel"><h3>'+sub+'</h3><p>'+descriptions[sub]+'</p><button style="background:#aaf078;color:#102018;padding:12px;border-radius:8px" onclick="alert(\'Demo only — no changes were made.\')">Try demo action</button></div>'}el('view').innerHTML=v}document.addEventListener('click',e=>{let a=e.target.closest('[data-section]'),b=e.target.closest('[data-sub]');if(a){section=a.dataset.section;sub=data[section][0];show()}if(b){sub=b.dataset.sub;show()}});show();</script></html>
