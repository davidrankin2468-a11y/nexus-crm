name: Vercel POS backend checks
on:
  push:
    branches: [feature/nexus-pos-crm-foundation]
    paths:
      - 'api/pos/**'
      - 'lib/nexus-pos-server.js'
      - 'tests/test_vercel_pos.mjs'
      - 'tests/test_vercel_pos_auth.mjs'
      - 'pos-secure/**'
      - 'api/square/**'
      - 'lib/nexus-square-sandbox.js'
      - 'tests/test_square_sandbox.mjs'
      - 'vercel.json'
      - '.github/workflows/vercel-pos-checks.yml'
  pull_request:
    paths:
      - 'api/pos/**'
      - 'lib/nexus-pos-server.js'
      - 'tests/test_vercel_pos.mjs'
      - 'tests/test_vercel_pos_auth.mjs'
      - 'pos-secure/**'
      - 'api/square/**'
      - 'lib/nexus-square-sandbox.js'
      - 'tests/test_square_sandbox.mjs'
      - 'vercel.json'
      - '.github/workflows/vercel-pos-checks.yml'
permissions:
  contents: read
jobs:
  test-pos-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Vercel server modules
        run: |
          node --check lib/nexus-pos-server.js
          node --check api/pos/products.js
          node --check api/pos/login.js
          node --check api/pos/companies.js
          node --check api/pos/receipts.js
          node --check api/pos/sales.js
          node --check api/pos/status.js
          node --check api/square/sandbox-status.js
          node --check lib/nexus-square-sandbox.js
      - name: Run POS security and API tests
        run: node --test tests/test_vercel_pos.mjs tests/test_vercel_pos_auth.mjs tests/test_square_sandbox.mjs
