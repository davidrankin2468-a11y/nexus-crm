name: Cloudflare Square Sandbox checks
on:
  push:
    paths:
      - 'cloudflare/square-sandbox-connectivity.js'
      - 'cloudflare/migrations/**'
      - 'tests/cloudflare-square-connectivity.test.mjs'
      - 'tests/test_cloudflare_square_d1.py'
      - '.github/workflows/cloudflare-square-checks.yml'
  pull_request:
    paths:
      - 'cloudflare/square-sandbox-connectivity.js'
      - 'cloudflare/migrations/**'
      - 'tests/cloudflare-square-connectivity.test.mjs'
      - 'tests/test_cloudflare_square_d1.py'
      - '.github/workflows/cloudflare-square-checks.yml'
permissions:
  contents: read
jobs:
  square-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cloudflare-square-connectivity.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_cloudflare_square_d1.py' -v
