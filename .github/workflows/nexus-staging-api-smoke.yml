name: Nexus CRM staging API smoke test
on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexus-license-manager-foundation
    paths:
      - 'cloud-app/**'
      - '.github/workflows/nexus-staging-api-smoke.yml'
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: read
jobs:
  staging-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify staging health and authentication boundary
        shell: bash
        env:
          BASE_URL: https://nexus-crm-license-staging.pages.dev
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            status=$(curl -sS -L --max-time 15 -o health.json -w '%{http_code}' "$BASE_URL/api/health" || true)
            if [ "$status" = "200" ]; then break; fi
            echo "Health attempt $attempt returned $status"
            sleep 10
          done
          test "$status" = "200" || { echo "Health endpoint unreachable or unhealthy"; exit 1; }
          python3 - <<'PY'
          import json
          with open('health.json', encoding='utf-8') as f: data=json.load(f)
          assert data.get('ok') is True, 'API health reported unhealthy'
          print('PASS: API health')
          PY
          status=$(curl -sS --max-time 15 -o status.json -w '%{http_code}' "$BASE_URL/api/status")
          test "$status" = "200" || { echo "FAIL: status endpoint HTTP $status"; exit 1; }
          python3 - <<'PY'
          import json
          with open('status.json', encoding='utf-8') as f: data=json.load(f)
          assert data.get('configured') is True, 'Staging setup unexpectedly incomplete'
          print('PASS: API status')
          PY
          status=$(curl -sS --max-time 15 -o me.json -w '%{http_code}' "$BASE_URL/api/me")
          test "$status" = "401" || { echo "FAIL: unauthenticated /api/me returned $status (expected 401)"; exit 1; }
          echo 'PASS: protected API denies unauthenticated requests'
