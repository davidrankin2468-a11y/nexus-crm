name: Nexus CRM phase 3 security gate
on:
  workflow_dispatch:
  push:
    branches: [feature/nexus-license-manager-foundation]
    paths:
      - 'cloud-app/functions/api/**'
      - '.github/workflows/nexus-staging-security-phase3.yml'
permissions:
  contents: read
jobs:
  phase3-source-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify tenant-scoped record access and license-denial code
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('cloud-app/functions/api/[[path]].js','utf8');
          const customerGet=src.match(/if\(path==="\/api\/customers"&&method==="GET"\)\{([\s\S]*?)\n \}/);
          assert(customerGet,'customers list route missing');
          assert.match(customerGet[1],/FROM customers WHERE tenant_id=\?/);
          assert.match(customerGet[1],/user\.tenant_id/);
          const customerPatch=src.match(/if\(path\.startsWith\("\/api\/customers\/"\)&&method==="PATCH"\)\{([\s\S]*?)\n \}/);
          assert(customerPatch,'customer update route missing');
          assert.match(customerPatch[1],/SELECT \* FROM customers WHERE id=\? AND tenant_id=\?/);
          assert.match(customerPatch[1],/UPDATE customers SET[^\n]*WHERE id=\? AND tenant_id=\?/);
          assert.match(customerPatch[1],/user\.tenant_id/);
          assert.match(src,/if\(path==="\/api\/license\/require"&&!allowed\)return response\([^\n]*403\)/);
          assert.match(src,/if\(!permitted\(user\.role,method,path\)\)return error\([^\n]*403\)/);
          console.log('PASS: tenant-scoped list/update, role denial, and license-denial guards');
          console.log('LIMITATION: source-level checks do not prove authenticated tenant isolation');
          JS
      - name: Verify public API does not expose protected data
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in /api/me /api/customers /api/jobs /api/invoices /api/license/me /api/license/require?feature=reports; do
            status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://nexus-crm-license-staging.pages.dev$endpoint")
            test "$status" = 401 || { echo "FAIL $endpoint returned $status instead of 401"; exit 1; }
            echo "PASS $endpoint protected"
          done
  authenticated-tenant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TENANT_A_EMAIL: ${{ secrets.NEXUS_TEST_TENANT_A_EMAIL }}
      TENANT_A_PASSWORD: ${{ secrets.NEXUS_TEST_TENANT_A_PASSWORD }}
      TENANT_B_EMAIL: ${{ secrets.NEXUS_TEST_TENANT_B_EMAIL }}
      TENANT_B_PASSWORD: ${{ secrets.NEXUS_TEST_TENANT_B_PASSWORD }}
    steps:
      - name: Require isolated staging test credentials
        shell: bash
        run: |
          if [[ -z "$TENANT_A_EMAIL" || -z "$TENANT_A_PASSWORD" || -z "$TENANT_B_EMAIL" || -z "$TENANT_B_PASSWORD" ]]; then
            echo "::error::Phase 3 authenticated testing blocked: staging-only test accounts and GitHub Actions secrets are not provisioned."
            echo "Do not use real customer or owner credentials."
            exit 1
          fi
          echo "Test credentials present. Authenticated test implementation must be added before claiming completion."
          exit 1
