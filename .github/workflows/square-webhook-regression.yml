name: Nexus CRM POS security regression
on:
  push:
    branches: [feature/nexus-pos-crm-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webhook-tests:
    name: Square Sandbox webhook regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check cloud-app/functions/api/square-sandbox-webhook.js
          node --check cloud-app/functions/api/square-d1-reconciliation.js
          node --check cloud-app/tests/square-webhook.test.mjs
      - name: Run webhook regression tests
        run: node --test cloud-app/tests/square-webhook.test.mjs
