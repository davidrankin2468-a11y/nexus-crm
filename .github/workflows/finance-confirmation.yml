name: Finance confirmation regression
on:
  push:
    branches: [feature/nexus-pos-crm-foundation]
    paths:
      - 'cloud-app/public/assets/app.js'
      - 'tests/finance-confirmation.test.cjs'
      - 'tests/finance-server-invariants.test.cjs'
      - 'tests/job-site-fields.test.cjs'
      - 'tests/audit-confirmation.test.cjs'
      - 'tests/pos-void-payment-guard.test.cjs'
      - 'cloud-app/functions/api/pos/[[path]].js'
      - 'cloud-app/functions/api/[[path]].js'
      - 'cloud-app/migrations/2026-11-job-site-fields.sql'
      - 'cloud-app/schema.sql'
      - '.github/workflows/finance-confirmation.yml'
  workflow_dispatch:
jobs:
  finance-confirmation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finance confirmation fault-injection regression
        run: node --test tests/finance-confirmation.test.cjs tests/finance-server-invariants.test.cjs tests/job-site-fields.test.cjs tests/audit-confirmation.test.cjs tests/pos-void-payment-guard.test.cjs
      - name: JavaScript syntax
        run: |
          node --check cloud-app/public/assets/app.js
          node --input-type=module --check < 'cloud-app/functions/api/[[path]].js'
          node --input-type=module --check < 'cloud-app/functions/api/pos/[[path]].js'
