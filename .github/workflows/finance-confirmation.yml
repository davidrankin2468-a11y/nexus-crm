name: Finance confirmation regression
on:
  push:
    branches: [feature/nexus-pos-crm-foundation]
    paths:
      - 'cloud-app/public/assets/app.js'
      - 'tests/finance-confirmation.test.cjs'
      - 'tests/finance-server-invariants.test.cjs'
      - '.github/workflows/finance-confirmation.yml'
  workflow_dispatch:
jobs:
  finance-confirmation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finance confirmation fault-injection regression
        run: node --test tests/finance-confirmation.test.cjs tests/finance-server-invariants.test.cjs
      - name: JavaScript syntax
        run: node --check cloud-app/public/assets/app.js
